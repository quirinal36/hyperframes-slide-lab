function initPopulation(){
 const group=document.querySelector('#pyramid-bars');
 let html='<text x="220" y="18" text-anchor="middle" font-size="18">남성</text><text x="670" y="18" text-anchor="middle" font-size="18">여성</text>';
 for(let band=20;band>=0;band--){const y=30+(20-band)*17;html+='<rect class="pyramid-bar male-bar" data-band="'+band+'" x="410" y="'+y+'" width="0" height="12" fill="#91b6ff"/><text class="pyramid-age" data-band="'+band+'" x="445" y="'+(y+11)+'" text-anchor="middle"></text><rect class="pyramid-bar female-bar" data-band="'+band+'" x="480" y="'+y+'" width="0" height="12" fill="#b8a4e8"/>'}
 for(let side=0;side<2;side++)for(let j=0;j<=2;j++){const x=side?480+j*190:410-j*190;html+='<text x="'+x+'" y="409" text-anchor="middle" font-size="15">'+(populationScale*j/2/1000000).toFixed(1)+'백만</text>'}
 group.innerHTML=html;
 document.querySelector('#population-year').value=populationYear;
 syncPopulationRange();
 document.querySelector('#population-year').addEventListener('input',e=>{populationYear=Number(e.target.value);syncPopulationRange();updatePopulation(true)});
 document.querySelector('#population-age-min').addEventListener('change',e=>{populationAgeMin=Number(e.target.value);syncPopulationRange();updatePopulation(true)});
 document.querySelector('#population-age-max').addEventListener('change',e=>{populationAgeMax=e.target.value==='all'?null:Number(e.target.value);updatePopulation(true)});

function updatePopulation(animate){
 const row=populationData.years[populationYear],stats=populationStats(populationYear,populationAgeMin,populationAgeMax),format=new Intl.NumberFormat('ko-KR');
 document.querySelector('#population-year-title').textContent=populationYear+'년';
 document.querySelector('#population-year-output').textContent=populationYear+'년';
 document.querySelector('#population-total').textContent=format.format(stats.total)+'명';
 document.querySelector('#population-selected').textContent=format.format(stats.selected)+'명';
 document.querySelector('#population-selected-label').textContent=populationRangeLabel()+' 인구';
 document.querySelector('#population-share').textContent=stats.share.toFixed(1)+'%';
 document.querySelector('#population-formula').textContent=format.format(stats.selected)+' ÷ '+format.format(stats.total)+' × 100';
 document.querySelector('#pyramid-description').textContent=populationYear+'년 전국 남녀 인구 피라미드. 총 '+format.format(stats.total)+'명. '+populationRangeLabel()+' '+format.format(stats.selected)+'명, '+stats.share.toFixed(1)+'퍼센트.';
 if(populationTween)populationTween.kill();
 const targets=[];
 for(let band=0;band<=20;band++){
  const low=band*5,exists=band<row.male.length,last=band===row.male.length-1,label=document.querySelector('.pyramid-age[data-band="'+band+'"]');
  label.textContent=exists?(last?low+'+':low+'–'+(low+4)):'';
  for(const [sex,end] of [['male',410],['female',480]]){
   const rect=document.querySelector('.'+sex+'-bar[data-band="'+band+'"]');
   const count=exists?row[sex][band]:0,width=count/populationScale*380;
   targets.push({rect,width,x:sex==='male'?end-width:end,opacity:exists?(low>=populationAgeMin&&(populationAgeMax===null||low<=populationAgeMax)?1:.28):0});
  }
 }
 if(animate&&window.gsap&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
  populationTween=gsap.timeline();targets.forEach(t=>populationTween.to(t.rect,{attr:{width:t.width,x:t.x},opacity:t.opacity,duration:.3,ease:'power2.out'},0));
 }else targets.forEach(t=>{t.rect.setAttribute('width',t.width);t.rect.setAttribute('x',t.x);t.rect.style.opacity=t.opacity});
}

function initComparison(){
 const slider=document.querySelector('#blueberry-comparison');
 function setPosition(value){
  comparisonPosition=Math.max(0,Math.min(100,Number(value)));slider.value=comparisonPosition;
  const percent=Math.round(comparisonPosition);slider.setAttribute('aria-valuenow',String(percent));slider.setAttribute('aria-valuetext','원본 '+percent+'퍼센트, 꾸민 사진 '+(100-percent)+'퍼센트');
  document.querySelector('#comparison-readout').textContent='원본 '+percent+'% · 꾸민 사진 '+(100-percent)+'%';

 slider.addEventListener('slide',()=>setPosition(slider.value));
 slide.querySelectorAll('[data-comparison-value]').forEach(button=>button.onclick=()=>setPosition(button.dataset.comparisonValue));

function addWordSwap(tl,words,at,interval){
 tl.set(words,{autoAlpha:0,yPercent:110},0).to(words[0],{yPercent:0,autoAlpha:1,duration:.55,ease:'power3.out'},at);
 for(let j=1;j<words.length;j++){
  const time=at+j*interval;
  tl.to(words[j-1],{yPercent:-110,autoAlpha:0,duration:.5,ease:'power3.inOut'},time).to(words[j],{yPercent:0,autoAlpha:1,duration:.6,ease:'power3.out'},time);
 }
}
function addTutorialEffects(tl){
 slide.querySelectorAll('.demo').forEach((demo,i)=>{
  const at=.35+i*.18;
  switch(demo.dataset.effect){
   case 'mask':tl.from(demo.querySelector('.mask-text'),{yPercent:115,duration:1.15,ease:'power4.out'},at);break;
   case 'words':tl.from(demo.querySelectorAll('.demo-word'),{opacity:0,y:18,duration:.7,stagger:.38,ease:'power3.out'},at);break;
   case 'typing':tl.from(demo.querySelectorAll('.type-char'),{autoAlpha:0,duration:.01,stagger:.16,ease:'none'},at).fromTo(demo.querySelector('.type-cursor'),{opacity:1},{opacity:0,duration:.35,repeat:5,yoyo:true,ease:'steps(1)'},at);break;
   case 'reading':tl.to(demo.querySelectorAll('.reading-word'),{color:'#91b6ff',duration:.35,stagger:.6},at);break;
   case 'marker':tl.from(demo.querySelector('.marker-bar'),{scaleX:0,duration:1.2,ease:'power2.inOut'},at);break;
   case 'pop':tl.from(demo.querySelector('.pop-text'),{scale:.4,opacity:0,duration:1.05,ease:'back.out(1.8)'},at);break;
   case 'blur':tl.from(demo.querySelector('.blur-text'),{filter:'blur(15px)',opacity:0,duration:1.6,ease:'power2.out'},at);break;
   case 'swap':{
    addWordSwap(tl,demo.querySelectorAll('.swap-word'),at,1.25);
    break;
   }
   case 'flip':tl.from(demo.querySelector('.flip-text'),{rotationX:-90,opacity:0,duration:1.25,ease:'power3.out'},at);break;
   case 'scramble':{
    const text=demo.querySelector('.scramble-text span'),target='명확한 답변',symbols='가나다라마바사아자차카타파하',state={progress:0};
    tl.to(state,{progress:1,duration:2.2,ease:'none',onUpdate:()=>{const revealed=Math.floor(state.progress*target.length);text.textContent=Array.from(target).map((c,j)=>c===' '||j<revealed?c:symbols[(Math.floor(state.progress*24)+j*3)%symbols.length]).join('')}},at);
    break;
   }
  }
 });
}

{kind:'tutorial',title:'텍스트 효과 튜토리얼 · 변형과 전환',body:tutorialBody(tutorialEffects.slice(5),'텍스트 효과 ② 변형과 전환'),note:"사용한 요청 · 2·3페이지 공통\n“2페이지와 3페이지는 효과 애니메이션의 이름을 table 에 보여주고, table 가장 오른쪽 td 에는 이 애니메이션이 동작하는 예시를 실제 텍스트가 나타나는 것을 보여주면서 배울 수 있는 튜토리얼페이지로 새로 만들어 끼워넣고 싶어.”\n\n추가 요청\n“애니메이션을 무한재생 할 수는 없을까?”\n\n실습 포인트\n같은 표 형식을 유지하면서 변형·전환 효과 5가지를 비교합니다. 이 장의 단어 교체 효과를 보고 4페이지 수정에 적용했습니다."},
{kind:'questions',title:'고객이 망설이는 이유',body:'<h2 class="headline" aria-label="효과가 있을까? 믿어도 될까? 나에게 맞을까?"><span class="question-swap" aria-hidden="true"><span class="swap-word">효과가 있을까?</span><span class="swap-word">믿어도 될까?</span><span class="swap-word accent">나에게 맞을까?</span></span></h2><p class="support">글을 쓰기 전에, 고객이 묻는 질문부터.</p>',note:"사용한 요청\n“4페이지는 제목 3행을 1행으로 만들어서 애니메이션 효과 중에서 단어 교체를 사용하는게 좋겠어.”\n지정한 문구: 효과가 있을까? / 믿어도 될까? / 나에게 맞을까?\n\n후속 요청\n“나에게 맞을까? 까지 애니메이션이 보인 뒤에 subtitle 이 블러 리빌 효과로 보여지면 좋겠다.”\n\n실습 포인트\n페이지 번호 + 바꿀 요소 + 효과 이름 + 문구를 지정합니다. 이어서 “마지막 질문 뒤에 부제목”처럼 실행 순서를 조정합니다."},
{kind:'population',title:'동적 차트 · 직접 계산 · 실시간 조작',body:populationBody(),note:"사용한 요청\n“KOSIS 인구 피라미드를 5페이지에 추가할거야. Hyperframes 의 장점 중 하나인 동적 차트와 직접 계산 가능과 실시간 조작을 보여주고 배우기 위해 만들거야.”\n\n추가 요청\n“이 파일을 폴더에 저장해줘. 이 CSV 파일로 인구피라미드 데이터를 만들어줘.”\n\n실습 포인트\nKOSIS에서 다운로드한 CSV를 AI에게 첨부하고, 이 파일을 데이터로 사용하라고 요청합니다. CSV의 연도별·성별·5세별 인구를 차트에 연결하고, 선택 연령 구간 인구를 합산한 뒤 총인구로 나눠 비중을 계산합니다. 1세별 수치를 임의로 만들지 않고 CSV의 5세 단위를 그대로 사용합니다.\n\n시연 순서\n1960 → 2026 → 2072년으로 이동하고, 시작·끝 연령을 바꿔 0~14세, 15~64세, 65세 이상을 비교합니다. 사용한 CSV 링크로 실제 원본도 확인합니다.\n\n데이터와 계산 기준\n첨부한 성_및_연령별_추계인구_1세별__5세별____전국_20261027234210.csv. 전국 중위 추계, 1960~2072년, 단위 명, CP949 인코딩입니다. 원본 파일을 그대로 보존하고 차트용 JSON을 만들었습니다. 1999년 이전은 0~79세의 5세별 구간과 80세 이상을 사용합니다. 2000년 이후는 0~99세의 5세별 구간과 100세 이상을 사용하며, 중복되는 80세 이상 소계는 합산하지 않습니다. 결측 기호(-)는 0으로 바꾸지 않았습니다. 113개 연도 모두 남녀 합계·연령별 합계·총인구·80세 이상 소계를 대조했습니다.\n\n실행 환경\n저장된 CSV 데이터로 브라우저에서 즉시 계산합니다. 실시간 통계 조회는 아닙니다. Hyperframes로 영상 출력할 때는 조작 순서를 시간축에 지정해야 하며, 출력된 영상 자체는 조작할 수 없습니다.\n\n출처\nKOSIS 성 및 연령별 추계인구(1세별, 5세별) / 전국\nhttps://kosis.kr/visual/populationKorea/PopulationDashBoardMain.do\n\n연령 구간 지정 요청\n“기준 연령을 n~m 세 사이를 지정해서 계산하고싶어”\n시작 연령과 끝 연령을 포함해 합산합니다. CSV의 5세 구간 단위를 유지하며, 시작은 0·5·10세…, 끝은 4·9·14세… 또는 상한 없음으로 고릅니다. 1999년 이전에는 80세 이상이 하나로 합산되므로 80세 이상의 세부 구간은 지정하지 않습니다."},
{kind:'structure',title:'걱정에 답하는 글의 구조',body:'<h2 class="headline"><span class="line">고객의 질문이</span><span class="line accent">글의 시작입니다</span></h2><div class="steps"><span class="step">걱정<small>어떤 점이 망설여지나요?</small></span><span class="connector" aria-hidden="true">→</span><span class="step accent">근거<small>실제 사례와 운영 방식</small></span><span class="connector" aria-hidden="true">→</span><span class="step">안내<small>다음에 무엇을 하면 되나요?</small></span></div>',note:"사용한 요청 · 전체 덱 공통\n“C안으로 디자인을 확정하고 나머지 페이지들도 슬라이드로 만들어보자.”\n\n실습 포인트\n큰 제목과 “걱정 → 근거 → 안내”의 단계 구성이 공통 요청에서 함께 만들어진 장입니다. 이 장만 따로 작성한 프롬프트는 없었습니다. 수정 실습에서는 바꿀 단계나 강조할 단어를 지정할 수 있습니다."},
{kind:'comparison',title:'이미지 Before / After 비교 실습',body:comparisonBody(),note:"사용한 요청 · 대화 발췌\n“7페이지 에는 이미지 2장을 slide 로 비교해서 보는 예제를 실습해 볼거야. https://ai-lecture-sns-automation.vercel.app/ 에서 블루베리 피킹과 같은 before/after 를 표현하는 페이지를 만들어보자. 이 것은 hyperframes 가 아니고 javascript 의 library 를 사용하는 예제이긴 하지만 충분히 실습해볼 가치가 있어.”\n\n실습 포인트\n원본과 편집 이미지를 첨부하고, 참고 사이트의 Before/After 비교 기능을 요청합니다. 참고 사이트에서 사용하는 img-comparison-slider 라이브러리(8.0.6)를 같은 방식으로 적용했습니다. 이 장은 Hyperframes 효과가 아니라 JavaScript 라이브러리를 HTML 슬라이드에 넣는 실습입니다.\n\n시연 순서\n경계선을 사진의 왼쪽과 오른쪽으로 드래그합니다. 원본 보기 → 꾸민 사진 → 반반 비교 버튼도 눌러봅니다. 사진을 선택한 상태에서 ← → 키로 조절해 접근성을 확인합니다. 이미지 비교 중에는 방향키가 페이지를 넘기지 않습니다.\n\n이미지와 실행 환경\n세로 이미지 전체를 자르지 않고 같은 크기로 겹쳤습니다. 첨부의 Windows 경로는 이 Mac에서 직접 읽을 수 없어, 사용자가 제공한 참고 사이트에서 동일한 두 이미지를 내려받아 첨부 이미지와 시각적으로 확인했습니다. 이미지와 라이브러리를 프로젝트 폴더에 저장해 인터넷 연결 없이 동작합니다.\n\n참고 자료\nhttps://ai-lecture-sns-automation.vercel.app/\nhttps://img-comparison-slider.sneas.io/examples.html"},
{kind:'workflow',title:'꾸준히 발행하는 운영 방식',body:'<h2 class="headline"><span class="line">완벽한 한 편보다</span><span class="line accent">이어지는 발행</span></h2><div class="steps"><span class="step">질문 수집</span><span class="connector" aria-hidden="true">→</span><span class="step">AI 초안</span><span class="connector" aria-hidden="true">→</span><span class="step accent">사실 확인</span><span class="connector" aria-hidden="true">→</span><span class="step">발행</span></div><p class="support">처음에는 주 1회처럼, 지킬 수 있는 주기를 정하세요.</p>',note:"사용한 요청 · 전체 덱 공통\n“C안으로 디자인을 확정하고 나머지 페이지들도 슬라이드로 만들어보자.”\n\n실습 포인트\n여러 단계를 가로로 배치하고 순차적으로 등장시킨 장입니다. 이 장만 따로 작성한 프롬프트는 없었습니다. 수정 실습에서는 순서와 강조 대상을 구체적으로 요청할 수 있습니다."},
{kind:'three-demo',title:'Three.js · 실시간 3D 조작',body:'<iframe class="three-viewer" src="assets/f1-viewer.html" title="F1 레이스카 Three.js 실습: 드래그 회전, 휠 확대, 시점 선택"></iframe>',note:"사용한 요청\n“3d 를 보여주는 three.js 도 사용하는 것을 예제로 한 페이지 만들어 넣고 싶어. 8페이지 슬라이드로 적합하겠어”\n\n실습 · 3D 레이싱카 제작 과정\nartstation-imgs 폴더에 있는 빨간 F1 경주차 사진 9장을 참고 이미지로 사용했습니다. 실제 3D 파일 없이 여러 방향의 사진을 보고 비슷한 형태를 만드는 실습입니다.\n\n실제 사용한 제작 프롬프트 · 원문\n이 폴더에 있는 빨간 F1 경주차 사진 9장을 보고, 웹 브라우저에서 열면 그 차를 마우스로 빙글빙글 돌려가며 사방에서 볼 수 있는 웹페이지를 하나 만들어줘. 진짜 3D 파일은 없으니 사진만 보고 최대한 비슷하게 만들고, 다 만들면 직접 열어서 제대로 보이는지 확인해줘.\n\n슬라이드에 통합하기\n완성한 HTML 뷰어를 첨부하고 8페이지에 넣도록 요청했습니다. 첨부 뷰어의 모델을 재사용하고, 글꼴·색상·여백을 발표 디자인에 맞췄습니다. Three.js 0.160.0은 프로젝트 폴더에 저장했습니다.\n\n시연 · 제작 결과 확인\n자동 회전을 켜고 끕니다. 드래그로 모델을 돌린 뒤 휠로 확대합니다. 앞·옆·뒤·위 시점 버튼을 눌러 같은 모델을 다른 각도로 봅니다. 캔버스를 선택하고 방향키와 + / − 키도 사용해봅니다.\n\n모델과 실행 환경\n이 자동차는 첨부 HTML에 포함된 도형으로 구성한 실습용 모델입니다. 실제 차량의 공식 3D 자산이나 정확한 제원 자료를 불러온 것은 아닙니다. 외부 모델·텍스처 파일이 필요하지 않으며, 원본 HTML도 폴더에 보관했습니다. 브라우저의 WebGL과 로컬 미리보기 서버를 사용합니다. 다른 페이지로 이동하면 뷰어도 제거되어 회전과 렌더링이 중지됩니다.\n\nHyperframes와의 관계\n이 장은 Three.js의 브라우저 직접 조작 실습입니다. 영상으로 출력할 경우 회전·카메라 움직임을 시간축으로 지정해야 합니다.\n\n페이지 이동 요청\n“8페이지와 9페이지의 위치를 서로 바꿔줘.”\n기존 8페이지의 Three.js 실습은 현재 9페이지로 이동했습니다."},
{kind:'channels',title:'블로그와 숏폼의 역할',body:'<h2 class="headline"><span class="line">짧게 알리고,</span><span class="line accent">자세히 답하세요</span></h2><div class="steps"><span class="step">숏폼<small>관심을 끄는 짧은 장면<br>지역·상호 정보 함께 표시</small></span><span class="step accent">블로그<small>사례와 이용 조건 설명<br>고객의 질문에 충분히 답변</small></span></div>',note:"사용한 요청 · 전체 덱 공통\n“C안으로 디자인을 확정하고 나머지 페이지들도 슬라이드로 만들어보자.”\n\n실습 포인트\n두 항목을 나란히 비교하는 구성이 공통 요청에서 만들어졌습니다. 이 장만 따로 작성한 프롬프트는 없었습니다. 수정 실습에서는 좌우 배치, 두 항목의 간격, 색상 차이를 지정할 수 있습니다."},
{kind:'galton',title:'Matter.js · 공 개수와 정규분포 실험',body:'<iframe class="galton-viewer" src="assets/galton-viewer.html" title="Matter.js 갈톤 보드: 선택한 개수의 공의 도착 분포와 정규근사 비교"></iframe>',note:"사용한 요청\n“8페이지와 9페이지의 위치를 서로 바꿔줘. 11페이지에는 새로운 페이지를 추가할거야. matter.js 를 이용한 정규분포 수학 실험을 하는 페이지로 구성할거야. 내가 첨부한 이미지처럼 600개의 하얀색 공을 떨어뜨리고 정규분포 곡선과 비슷하게 나오는지 확인할거야.”\n\n실습 포인트\n참고 이미지를 첨부하고 공 개수, 색, 물리 라이브러리, 관찰할 수학적 관계를 지정합니다. Matter.js가 충돌과 중력을 계산하며, 실제 도착 위치로 14개 구간의 개수를 집계합니다. 완성된 히스토그램을 미리 정해놓지 않습니다.\n\n시연 순서\n공 개수를 입력한 뒤 시작을 누르고, 흰 공이 13줄의 핀을 통과하는 모습을 봅니다. 2× 또는 4×로 속도를 올릴 수 있습니다. 일시정지로 도중 결과를 살펴보고, 모두 도착하면 실제 평균 위치와 분산을 이론값과 비교합니다. 다시 실험으로 새 결과를 확인합니다.\n\n수학적 기준\n매 단계가 독립이고 좌우 확률이 1/2인 이상적 모형의 도착 구간 X는 B(13, 0.5), 평균 6.5, 분산 3.25입니다. 이를 N(6.5, 3.25)로 근사한 노란 곡선을 실제 히스토그램에 겹칩니다. 곡선은 도착한 공 수와 구간 폭 1에 맞춰 크기를 환산합니다. 표시한 실험 분산은 도착 구간의 모집단식 분산(분모: 도착 공 수)입니다. 실제 충돌은 마찰·초기 위치·공끼리 충돌의 영향을 받으므로 이상적 이항모형과 완전히 일치한다고 보장하지 않습니다.\n\n실행 환경\nMatter.js 0.20.0은 로컬에 보관했습니다. 선택한 개수만큼 투입하고, 시작/일시정지/초기화가 가능합니다. 다른 페이지로 이동하면 iframe이 제거되어 실험이 중지됩니다. 물리 실험은 시간축에 고정된 Hyperframes 영상과 별개의 브라우저 직접 조작 예제입니다.\n\n참고 자료\nhttps://brm.io/matter-js/\nhttps://www.itl.nist.gov/div898/handbook/eda/section3/eda366i.htm\nhttps://www.itl.nist.gov/div898/handbook/eda/section3/eda3661.htm\n\n공 개수 변경 요청\n“공의 개수를 1200개로 늘려보자.”\n실험의 공 개수와 투입·도착 집계 기준을 1200개로 변경했습니다.\n\n공 개수 직접 조절 요청\n“페이지에서 공 개수를 조정할 수 있도록 해줘”\n공 개수 입력란에서 1~1800개 중 정수를 선택합니다. 실험을 시작하면 개수가 고정되고, 다시 실험을 누르면 개수를 바꿀 수 있습니다. 제목·목표 개수·완료 조건·히스토그램 눈금도 선택한 개수에 맞춥니다. 현재 수집 구간의 공간을 고려해 상한은 1800개입니다.\n\n최대 개수 변경 요청\n“최대 개수를 1800개로 설정해줘”\n입력 상한을1800개로 늘리고, 수집 구간이 가득 차 공이 집계선 위에 머무르지 않도록 공의 크기와 공기 저항을 조정했습니다. 초기 선택값은1200개를 유지합니다."},
{kind:'transitions',title:'슬라이드 전환효과 실습',body:'<iframe class="transitions-viewer" src="assets/transitions-viewer.html" title="페이드, 밀어내기, 줌, 와이프 비교 실습"></iframe>',note:"사용한 요청\n“슬라이드에 전환효과 예제도 몇 가지 넣어주면 좋을 것 같아.”\n\n실습 · 시연\n페이드, 밀어내기, 줌, 와이프를 차례로 선택합니다. 같은 두 장면의 차이를 비교하고 다음 장면 재생으로 다시 확인합니다. 반복 재생으로 A와 B가 계속 전환되며 반복 정지로 멈춥니다.\n\n실습 포인트\n텍스트 등장과 화면 전체 전환을 구분합니다. 브라우저의 Web Animations API로 장면 전체를 움직이는 예제이며 기존 페이지 사이에 전환을 일괄 적용하는 설정은 아닙니다. 원하는 효과를 고른 뒤 특정 페이지 사이에 적용하도록 후속 요청할 수 있습니다.\n\n구현 요청 예시 · 추가 학습용\n같은 두 장면으로 페이드·밀어내기·줌·와이프 전환을 비교하는 페이지를 만들어줘. 효과 선택과 재생·반복 정지 버튼을 넣고 기존 남색 키노트 디자인을 유지해줘.\n\n실행 환경\n외부 라이브러리 없이 실행합니다. 동작 줄이기 설정에서는 장면을 즉시 교체합니다. 다른 페이지로 이동하면 반복 재생도 중지됩니다. 영상으로 출력하려면 전환을 Hyperframes 시간축에 연결해야 합니다."},
{kind:'closing',title:'첫 글의 출발점',body:'<h2 class="headline"><span class="line">고객이 가장 자주 묻는</span><span class="line accent">질문 하나부터</span></h2><p class="support">질문을 고르고, 근거를 모으고, 첫 글을 발행하세요.</p>',note:"사용한 요청 · 전체 덱 공통\n“C안으로 디자인을 확정하고 나머지 페이지들도 슬라이드로 만들어보자.”\n\n실습 포인트\n큰 두 줄 제목과 짧은 안내 문장으로 끝맺는 장입니다. 이 장만 따로 작성한 프롬프트는 없었습니다. 수정 실습에서는 마지막에 남길 문구와 애니메이션이 멈출 상태를 지정할 수 있습니다."}
];
const stage=document.querySelector('.stage'),slide=document.querySelector('.slide');
let scene=0,timeline;
try{const saved=Number(localStorage.getItem('blog-keynote-12-page'));if(Number.isInteger(saved)&&saved>=0&&saved<scenes.length)scene=saved}catch{}
const navigation=document.querySelector('.pages');
scenes.forEach((item,i)=>{const button=document.createElement('button');button.textContent=String(i+1).padStart(2,'0');button.setAttribute('aria-label',`${i+1}장: ${item.title}`);button.onclick=()=>{scene=i;render()};navigation.append(button)});
function fit(){const box=document.querySelector('.viewport');const scale=Math.min(box.clientWidth/1600,box.clientHeight/900);stage.style.transform=`scale(${scale})`;stage.style.setProperty('--scale',scale)}
function render(){
 if(timeline)timeline.kill();
 if(populationTween)populationTween.kill();
 const item=scenes[scene];const tutorial=item.kind==='tutorial',duration=tutorial?6.4:item.kind==='questions'?7.2:4.2;stage.dataset.duration=String(duration);slide.dataset.duration=String(duration);slide.className=`slide clip ${item.kind}`;
 slide.innerHTML=`${item.kind==='cover'?'<img class="cover-art" src="assets/cover-questions-to-writing.png" alt="고객의 질문을 상징하는 푸른 유리 말풍선 두 개와 답변이 담긴 한 장의 글">':''}<div class="content">${item.body}</div><div class="slide-bottom"><span>서비스 블로그 마케팅 및 글 작성 전략</span><span>${String(scene+1).padStart(2,'0')}</span></div>`;
 if(item.kind==='population')initPopulation();
 if(item.kind==='comparison')initComparison();
 document.querySelector('#direction-title').textContent=`발표자 메모 · ${String(scene+1).padStart(2,'0')} ${item.title}`;
 document.querySelector('#description').textContent=item.note;
 [...navigation.children].forEach((b,i)=>{if(i===scene)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 document.querySelector('#counter').textContent=`${scene+1} / ${scenes.length}`;
 document.querySelector('#previous').disabled=scene===0;document.querySelector('#next').disabled=scene===scenes.length-1;
 try{localStorage.setItem('blog-keynote-12-page',scene)}catch{}
 if(window.gsap){
  timeline=gsap.timeline({paused:true});
  if(tutorial)addTutorialEffects(timeline);
  else if(item.kind==='population')timeline.from('.pyramid-chart',{opacity:0,duration:.65},.2);
  else if(item.kind==='three-demo'||item.kind==='galton'||item.kind==='transitions')timeline.from('.slide-bottom',{opacity:0,duration:.4},.2);
  else {
   if(item.kind==='questions')addWordSwap(timeline,slide.querySelectorAll('.question-swap .swap-word'),.2,2.4);
   else timeline.from('.headline > span',{opacity:0,y:42,duration:.8,stagger:.2,ease:'expo.out'},.2);
   if(slide.querySelector('.cover-art'))timeline.from('.cover-art',{opacity:0,y:18,duration:1.15,ease:'power2.out'},.45);
   const parts=slide.querySelectorAll('.step,.connector,blockquote p');if(parts.length)timeline.from(parts,{opacity:0,y:22,duration:.7,stagger:.25,ease:'power3.out'},1);
   if(slide.querySelector('.support')){
    if(item.kind==='questions')timeline.from('.support',{opacity:0,filter:'blur(16px)',duration:1.15,ease:'power2.out'},5.9);
    else timeline.from('.support',{opacity:0,y:14,duration:.65},parts.length?2.7:1.1);
   }
   timeline.from('.slide-bottom',{opacity:0,duration:.4},1.3);
  }
  timeline.set({}, {},duration);window.__timelines={keynote:timeline};
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced)timeline.progress(1);else {if(tutorial)timeline.repeat(-1).repeatDelay(.8);timeline.play(0);}
  document.querySelector('#status').textContent=tutorial?(reduced?'동작 줄이기 설정으로 최종 상태를 표시합니다.':'오른쪽 예시 무한 반복 · 다시 재생 또는 Space로 처음부터 볼 수 있습니다.') : '';
 }
 else document.querySelector('#status').textContent='애니메이션을 불러오지 못해 정지 화면으로 표시합니다.';
 fit();
}
function move(amount){scene=Math.max(0,Math.min(scene+amount,scenes.length-1));render()}
function expand(force){const active=force===undefined?!document.body.classList.contains('fullscreen'):force;document.body.classList.toggle('fullscreen',active);document.querySelector('#expand').setAttribute('aria-pressed',String(active));document.querySelector('#expand').textContent=active?'작게 보기':'크게 보기';fit()}
document.querySelector('#previous').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.querySelector('#replay').onclick=render;document.querySelector('#expand').onclick=()=>expand();
document.addEventListener('keydown',e=>{if(e.altKey||e.metaKey||e.ctrlKey||/INPUT|TEXTAREA|SELECT|IMG-COMPARISON-SLIDER/.test(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();move(1)}if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}if(e.code==='Space'&&e.target===document.body){e.preventDefault();render()}if(e.key.toLowerCase()==='f'&&e.target===document.body)expand();if(e.key==='Escape')expand(false)});
new ResizeObserver(fit).observe(document.querySelector('.viewport'));render();
</script>
</body></html>
